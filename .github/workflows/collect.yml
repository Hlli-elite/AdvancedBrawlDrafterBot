name: Collect Brawl Stars Data

on:
  schedule:
    - cron: '0 * * * *'   # every hour at :00
  workflow_dispatch:       # also lets you trigger it manually from GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50    # kill if it runs over (API slowness etc.)

    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install aiohttp

      # 4. Restore brawl_stats.json from cache (persistent accumulator)
      - name: Restore brawl_stats.json cache
        uses: actions/cache@v4
        with:
          path: brawl_stats.json
          key: brawl-stats-${{ runner.os }}
          restore-keys: |
            brawl-stats-

      # 5. Run the tracker
      - name: Run tracker
        run: python brawl_tracker.py

      # 6. Commit and push updated data.json
      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update data/ [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
